<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>知练 · 网页 UI 展示稿</title>
  <link rel="stylesheet" href="shared.css" />
  <link rel="stylesheet" href="bento-theme.css" />
  <link rel="stylesheet" href="ui-ref-home.css" />
</head>
<body class="theme-bento web-ui-page">

  <div class="web-ui-shell">
    <header class="web-ui-brand-outside">
      <span class="logo-cn">知练</span>
      <span class="logo-en">KnowPractice</span>
    </header>

    <div class="web-ui-stage">
      <div class="phone-wrap ref-home">
        <div class="phone-frame">
          <div class="phone-notch" aria-hidden="true"></div>
          <div class="phone-screen bt-screen">
            <div class="ref-home-scroll">
              <div class="ref-topbar">
                <div class="ref-user">
                  <span class="ref-avatar" aria-hidden="true">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg>
                  </span>
                  <span>你好，<strong>小皮</strong> <span class="ref-chevron" aria-hidden="true">›</span></span>
                </div>
                <button type="button" class="ref-icon-btn" tabindex="-1" aria-label="日历">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                </button>
              </div>

              <section class="ref-hero" aria-labelledby="ref-hero-title">
                <h2 id="ref-hero-title">今天想闯哪一关？</h2>
              </section>

              <div class="ref-input-card">
                <div class="ref-input-body">
                  <span class="field">输入你想学的内容</span>
                  <svg class="bt-input-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 20h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4 12.5-12.5z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
                </div>
                <button type="button" class="ref-btn-generate" tabindex="-1">开始生成题目</button>
              </div>

              <div class="ref-topic-row">
                <div class="ref-topic">
                  <div class="ref-topic-icon ref-topic-icon--orange" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                  </div>
                  <strong>RAG 基础概念</strong>
                  <span class="heat">热度 92%</span>
                </div>
                <div class="ref-topic">
                  <div class="ref-topic-icon ref-topic-icon--blue" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M2 12h3M19 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/></svg>
                  </div>
                  <strong>提示词工程</strong>
                  <span class="heat">热度 88%</span>
                </div>
              </div>

              <div class="ref-section-hd">
                <span>未完成关卡</span>
                <span class="link">查看全部 ›</span>
              </div>

              <article class="ref-level-card">
                <div class="bt-ring" aria-label="进度 60%">
                  <svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15" fill="none" stroke="#E8E2D9" stroke-width="3"/><circle cx="18" cy="18" r="15" fill="none" stroke="#F06A2A" stroke-width="3" stroke-dasharray="94.2" stroke-dashoffset="37.7" stroke-linecap="round"/></svg>
                  <b>60%</b>
                </div>
                <div class="ref-level-body">
                  <div class="title-row">
                    <strong>RAG 基础概念入门</strong>
                    <span class="ref-lv-tag">第 3 关</span>
                  </div>
                  <p class="desc">检索增强生成入门：理解检索、增强、生成如何协同。</p>
                  <p class="progress-txt">进度 6/10</p>
                </div>
                <span class="ref-level-go" aria-hidden="true">›</span>
              </article>
            </div>
          </div>

          <nav class="bt-tabbar bt-tabbar-float" aria-label="主导航">
            <button type="button" class="bt-tab is-active" tabindex="-1" aria-current="page">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
              闯关
            </button>
            <button type="button" class="bt-tab" tabindex="-1">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
              题库
            </button>
            <button type="button" class="bt-tab" tabindex="-1">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></svg>
              勋章
            </button>
          </nav>
        </div>
      </div>
    </div>

    <p class="web-ui-note">
      点阵光晕页外背景 · 屏内参考首页布局 · <a href="01_mvp_core.html">开发画廊</a>
    </p>
  </div>

</body>
</html>
